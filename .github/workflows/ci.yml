name: Run pytests for package

# CI Variables
env:
    # Pytest Outputs
    SUMMARY: logs/summary.md
    ERRORS: logs/errors.log
    WARNINGS: logs/warnings.log
    RAW: logs/pytest_raw_output.txt

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ main, develop ]
    types: [opened,reopened,edited,synchronize]
  # Allowing workflow to run from actions manually
  workflow_dispatch:

# For PR commenting with summary
permissions:
  pull-requests: write
  contents: read

# Limit duplicate CI runs (if branch is pushed too and a PR is open)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-tomls-python3-12:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi  # Making this more generic
        pip install pytest pytest-md pytest-md-report toml

    - name: Install Package
      run: |
        pip install .

    - name: Run Tests
      if: success() || failure()
      run: |
        TEST_EXIT_CODE=0
        mkdir -p logs/

        pytest --md-report --md-report-verbose=1 --md-report-zeros=number --md-report-output=${{env.SUMMARY}}> ${{env.RAW}} || TEST_EXIT_CODE=$?
        pytest -p no:md-report -p no:warnings --no-header -r fE > ${{env.ERRORS}} || true
        pytest -p no:md-report --no-header -q -W ignore -r w > ${{env.WARNINGS}} || true

        echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> $GITHUB_ENV

        exit $TEST_EXIT_CODE

    - name: Customizing summary.md for PR output
      if: success() || failure()
      shell: python
      run: |
        import os

        test_exit_code=int(os.getenv("TEST_EXIT_CODE", "0"))
        errors_file=os.getenv("ERRORS")
        summary_file=os.getenv("SUMMARY")
        errors=""

        if os.path.exists(errors_file) and test_exit_code == 1:
          with open(errors_file, "r", encoding="utf-8") as f:
            errors = f.read().strip()
        if os.path.exists(summary_file):
          with open(summary_file, "r", encoding="utf-8") as f:
            sum = f.read().strip()
          with open(summary_file, "w", encoding="utf-8") as f:
            f.write("> [!Note]\n> This was generated by the CI process within this repository.\n\n")
            f.write("### PyTest Summary\n\n")
            f.write(f"{sum}\n\n")
            if test_exit_code == 1:
              f.write("### Failure Information\n\n")
              f.write("```\n")
              f.write(f"{errors}\n```")
            else:
              f.write("**No pytest failures reported**")

    - name: Upload Pytest Log Artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pytest-logs
        path: logs/*
        retention-days: 7

    - name: Comment PR with Test Summary
      if: github.event_name == 'pull_request' && (success() || failure())
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        #header: summary-table
        path: ${{env.SUMMARY}}

