name: Run pytests for package

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ main, develop ]
    types: [opened,reopened,edited,synchronize]
  # Allowing workflow to run from actions manually
  workflow_dispatch:

# For PR commenting with summary
permissions:
  pull-requests: write
  contents: read

# Limit duplicate CI runs (if branch is pushed too and a PR is open)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-tomls-python3-12:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi  # Making this more generic
        pip install pytest pytest-md pytest-md-report toml

    - name: Install Package
      run: |
        pip install .

    - name: Run Tests
      if: success() || failure()
      run: |
        TEST_EXIT_CODE=0
        mkdir logs/
        pytest --md-report --md-report-verbose=1 --md-report-zeros=number --md-report-output=logs/summary.md > logs/pytest_raw_output.txt || TEST_EXIT_CODE=\$?
        pytest -p no:md-report -p no:warnings --no-header -r fE > logs/errors.log
        pytest -p no:md-report --no-header -q -W ignore -r w > logs/warnings.log

        exit $TEST_EXIT_CODE

    - name: Upload Pytest Log Artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pytest-logs
        path: logs/*
        retention-days: 7

    - name: Comment PR with Test Summary
      if: github.event_name == 'pull_request' && (success() || failure())
      uses: thollander/actions-comment-pull-request@v2
      with:
        filePath: logs/summary.md
        comment_tag: pytest_summary # Prevents spam
